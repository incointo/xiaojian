<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="420" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow" x="380" y="70" width="520" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <circle cx="210" cy="130" r="180" fill="#22d3ee" fill-opacity="0.15"/>
  <circle cx="1140" cy="620" r="220" fill="#34d399" fill-opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="430" y="90" width="420" height="540" rx="28" fill="url(#card)"/>
  </g>

  <rect x="460" y="130" width="360" height="52" rx="16" fill="#e2e8f0"/>
  <text x="488" y="163" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">TickNest</text>

  <rect x="460" y="208" width="360" height="64" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="488" y="247" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Design README preview section</text>

  <rect x="460" y="286" width="360" height="64" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="488" y="325" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Polish tray interactions</text>

  <rect x="460" y="364" width="360" height="64" rx="18" fill="#dcfce7" stroke="#86efac"/>
  <text x="488" y="403" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="20">Single instance flow complete</text>

  <rect x="460" y="444" width="360" height="64" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="8 8"/>
  <text x="488" y="483" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="20">Add your next task...</text>

  <text x="50" y="664" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">TickNest Preview Placeholder</text>
  <text x="50" y="694" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Replace with a real app screenshot when available.</text>
</svg>
