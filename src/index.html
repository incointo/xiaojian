<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>小笺</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="window-frame" id="app">
      <header class="topbar">
        <div class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span class="brand-name">小笺</span>
        </div>
        <div class="topbar-actions">
          <time class="date-label" id="date-label"></time>
          <button class="window-button" id="hide-window" type="button" aria-label="收进系统托盘" title="收进系统托盘">×</button>
        </div>
      </header>

      <div class="app-error" id="app-error" role="alert" hidden></div>

      <main class="main-content">
        <div class="task-sections" id="task-sections" aria-live="polite">
          <section class="task-section" aria-labelledby="today-heading">
            <div class="section-heading">
              <div class="section-title-wrap">
                <span class="section-dot today-dot" aria-hidden="true"></span>
                <h1 id="today-heading">今日</h1>
              </div>
              <span class="task-count" id="today-count">0</span>
            </div>
            <ul class="task-list" id="today-list"></ul>
            <details class="completed-list" id="today-completed" hidden>
              <summary><span>已完成</span><span class="completed-count" id="today-completed-count">0</span></summary>
              <ul class="task-list completed-items" id="today-completed-list"></ul>
            </details>
          </section>

          <section class="task-section daily-section" aria-labelledby="daily-heading">
            <div class="section-heading">
              <div class="section-title-wrap">
                <span class="section-dot daily-dot" aria-hidden="true"></span>
                <h2 id="daily-heading">每日</h2>
              </div>
              <span class="task-count" id="daily-count">0</span>
            </div>
            <ul class="task-list" id="daily-list"></ul>
            <details class="completed-list" id="daily-completed" hidden>
              <summary><span>今天已完成</span><span class="completed-count" id="daily-completed-count">0</span></summary>
              <ul class="task-list completed-items" id="daily-completed-list"></ul>
            </details>
          </section>
        </div>

        <form class="new-task-form" id="task-form">
          <input
            id="task-input"
            name="title"
            type="text"
            placeholder="记下一件小事…"
            aria-label="新任务标题"
            autocomplete="off"
          />
          <select id="task-kind" name="kind" aria-label="任务类型">
            <option value="today">今日</option>
            <option value="daily">每日</option>
          </select>
          <button class="add-button" type="submit" aria-label="添加任务" title="添加任务">+</button>
        </form>
        <div class="input-hint" id="input-hint" aria-live="polite"></div>

        <section class="note-section" aria-labelledby="note-heading">
          <div class="note-heading">
            <div>
              <h2 id="note-heading">随手记</h2>
              <p>只保存在这台电脑</p>
            </div>
            <span class="save-status" id="save-status" role="status">已保存</span>
          </div>
          <textarea id="note-input" aria-label="随手记内容" placeholder="写点备忘…" spellcheck="false" disabled></textarea>
        </section>
      </main>
    </div>
  </body>
</html>
